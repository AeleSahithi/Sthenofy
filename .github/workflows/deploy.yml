name: Deploy Sthenofy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY. Add both as GitHub repository Variables or Secrets before deploying."
            exit 1
          fi
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Missing FTP_SERVER, FTP_USERNAME or FTP_PASSWORD. Add them as GitHub repository Secrets (see supabase/SETUP.md, 'Hosting on Hostinger')."
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

      # Prints where the FTP login starts and what is there, so the upload folder can be verified.
      # The live site folder is the one that contains wp-config.php (before the switch) or index.html.
      - name: Show FTP folder layout
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          # srv1833.hstgr.io is the hosting server shown by hPanel's File Manager; its certificate
          # (*.hstgr.io) matches that name, so TLS is fully verified. The FTP IP alone does not match.
          host="srv1833.hstgr.io"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$host" -e "
            set ftp:ssl-force yes; set net:max-retries 2; set net:timeout 20;
            echo '== login folder:'; pwd;
            echo '== login folder contents:'; cls -1a;
            echo '== public_html:'; cls -1a public_html;
            echo '== domains:'; cls -1a domains;
            echo '== domains/sthenofy.com:'; cls -1a domains/sthenofy.com;
            echo '== domains/sthenofy.com/public_html:'; cls -1a domains/sthenofy.com/public_html;
            bye" 2>&1 | sed 's/^/  /'

      # public/.htaccess serves index.html for app pages and 404.html (with a 404 status) for unknown URLs.
      - name: Add 404 page
        run: cp dist/index.html dist/404.html

      # Uploads only changed files into the website folder. Hostinger's main FTP login starts in the
      # account home, so the live site is domains/sthenofy.com/public_html/ (override with variable FTP_SERVER_DIR).
      # Files this action did not upload (e.g. old WordPress files) are never deleted.
      # Hostinger's FTPS data connection occasionally resets (ECONNRESET), so failed uploads are retried.
      # The sync state file is only written after a complete upload, so a retry resumes safely.
      - name: Upload to Hostinger
        id: upload1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'domains/sthenofy.com/public_html/' }}
          timeout: 120000

      - name: Upload to Hostinger (retry 1)
        id: upload2
        if: steps.upload1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'domains/sthenofy.com/public_html/' }}
          timeout: 120000

      - name: Upload to Hostinger (retry 2)
        if: steps.upload1.outcome == 'failure' && steps.upload2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'domains/sthenofy.com/public_html/' }}
          timeout: 120000
